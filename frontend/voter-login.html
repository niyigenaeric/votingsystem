<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UR Student Voting - Voter sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Voter sign in</h1>
      <p class="sub">Sign in with your registration number and password. To vote, your name and email must also match the official eligible voter list.</p>
      <form id="loginForm" class="form-validation">
        <label for="reg">Registration number</label>
        <input type="text" id="reg" autocomplete="username" required>
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" autocomplete="name" required>
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" autocapitalize="off" spellcheck="false" required>
        <label for="pw">Password</label>
        <div class="password-field" data-password-field>
          <input type="password" id="pw" autocomplete="current-password" required>
          <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4-.8"></path></svg>
          </button>
        </div>
        <button id="submit" type="submit">Sign in to vote</button>
      </form>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <p class="sub" style="margin:14px 0 0">Need an account? <a href="voter-register.html">Create one here</a></p>
      <p class="sub" style="margin:8px 0 0">Administrator? <a href="index.html">Go to administrator sign in</a></p>
    </div>
  </div>

  <script src="password-toggle.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const submit = document.getElementById('submit');
    const msg = document.getElementById('msg');

    function show(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
    }

    form.addEventListener('invalid', () => form.classList.add('was-validated'), true);

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const regNumber = document.getElementById('reg').value.trim();
      const password = document.getElementById('pw').value;
      submit.disabled = true;
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            regNumber,
            fullName: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            password
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          show(data.message || 'Sign in failed. Check your details and try again.', 'err');
          return;
        }
        if (data.requiresCode) {
          show('This account requires administrator sign-in. Use the administrator sign-in page to continue.', 'err');
          return;
        }
        if (data.role !== 'voter') {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
          show('This page is for voter accounts. Use the administrator sign-in page instead.', 'err');
          return;
        }
        sessionStorage.setItem('role', data.role);
        window.location.assign('vote.html');
      } catch {
        show('Cannot reach the server. Check your connection and try again.', 'err');
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
