<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UR Student Voting - Choose a new password</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme-toggle.js" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Choose a new password</h1>
      <p class="sub">Choose a password with at least 10 characters, including a letter and a number.</p>
      <form id="resetForm" class="form-validation">
        <label for="password">New password</label>
        <div class="password-field" data-password-field>
          <input type="password" id="password" minlength="10" maxlength="72" pattern="(?=.*[A-Za-z])(?=.*\d).{10,72}" autocomplete="new-password" title="Use 10 to 72 characters, including a letter and a number." required>
          <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4-.8"></path></svg>
          </button>
        </div>
        <label for="confirmPassword">Confirm new password</label>
        <div class="password-field" data-password-field>
          <input type="password" id="confirmPassword" minlength="10" maxlength="72" autocomplete="new-password" required>
          <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4-.8"></path></svg>
          </button>
        </div>
        <button id="submit" type="submit">Save new password</button>
      </form>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <p id="loginLink" class="sub" style="margin:14px 0 0" hidden><a href="voter-login.html">Go to voter sign in</a></p>
      <p id="requestLink" class="sub" style="margin:14px 0 0" hidden><a href="forgot-password.html">Request another reset link</a></p>
    </div>
  </div>
  <footer class="app-footer">
    <span>University of Rwanda Student Elections</span>
    <span>Voter account password recovery</span>
  </footer>

  <script src="password-toggle.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const submit = document.getElementById('submit');
    const msg = document.getElementById('msg');
    const token = new URLSearchParams(location.search).get('token') || '';

    if (!/^[a-f0-9]{64}$/.test(token)) {
      form.hidden = true;
      msg.textContent = 'This password reset link is missing or invalid. Request a new one.';
      msg.className = 'msg err';
      document.getElementById('requestLink').hidden = false;
    }

    form.addEventListener('invalid', () => form.classList.add('was-validated'), true);
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        msg.textContent = 'The passwords do not match.';
        msg.className = 'msg err';
        return;
      }
      submit.disabled = true;
      msg.textContent = '';
      msg.className = 'msg';
      try {
        const response = await fetch('/api/auth/password-reset/confirm', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, confirmPassword })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          msg.textContent = data.message || 'Could not reset the password.';
          msg.className = 'msg err';
          if (response.status === 410) {
            form.hidden = true;
            document.getElementById('requestLink').hidden = false;
          }
          return;
        }
        form.hidden = true;
        msg.textContent = data.message;
        msg.className = 'msg ok';
        document.getElementById('loginLink').hidden = false;
        history.replaceState(null, '', location.pathname);
      } catch {
        msg.textContent = 'Cannot reach the server. Check your connection and try again.';
        msg.className = 'msg err';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
