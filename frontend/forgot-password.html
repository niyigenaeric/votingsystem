<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UR Student Voting - Reset password</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme-toggle.js" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Forgot your password?</h1>
      <p class="sub">Enter the email address on your voter account. If it matches, we will send a password reset link to that address.</p>
      <form id="requestForm" class="form-validation">
        <label for="email">Voter account email</label>
        <input type="email" id="email" maxlength="150" autocomplete="email" autocapitalize="off" spellcheck="false" required>
        <button id="submit" type="submit">Send reset link</button>
      </form>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <p class="sub" style="margin:14px 0 0"><a href="voter-login.html">Back to sign in</a></p>
    </div>
  </div>
  <footer class="app-footer">
    <span>University of Rwanda Student Elections</span>
    <span>Voter account password recovery</span>
  </footer>

  <script>
    const form = document.getElementById('requestForm');
    const submit = document.getElementById('submit');
    const msg = document.getElementById('msg');

    form.addEventListener('invalid', () => form.classList.add('was-validated'), true);
    form.addEventListener('submit', async event => {
      event.preventDefault();
      submit.disabled = true;
      msg.textContent = '';
      msg.className = 'msg';
      try {
        const response = await fetch('/api/auth/password-reset/request', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || 'Could not request a password reset.');
        msg.textContent = data.message;
        msg.className = 'msg ok';
      } catch (error) {
        msg.textContent = error.message || 'Cannot reach the server. Check your connection and try again.';
        msg.className = 'msg err';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
